<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chat</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Telegram injects --tg-theme-* variables automatically once the SDK
     loads inside the app — the fallbacks only matter if this is opened in
     a plain browser for testing. */
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8b8b8b);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --header-bg: var(--tg-theme-header-bg-color, var(--secondary-bg));
    --section-separator: rgba(127, 127, 127, 0.2);
  }

  /* Manual overrides for the Settings theme toggle — "System" (default)
     leaves the variables above alone, so it keeps following Telegram's
     live theme. Picking Light/Dark applies one of these instead. */
  html.theme-light {
    --bg: #ffffff;
    --secondary-bg: #f0f0f0;
    --text: #111111;
    --hint: #707579;
    --link: #2481cc;
    --button: #2481cc;
    --button-text: #ffffff;
    --header-bg: #f7f7f7;
  }
  html.theme-dark {
    --bg: #17212b;
    --secondary-bg: #232e3c;
    --text: #ffffff;
    --hint: #7d8b99;
    --link: #6ab3f3;
    --button: #5288c1;
    --button-text: #ffffff;
    --header-bg: #17212b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
  }

  #app {
    position: relative;
    height: 100dvh;
    overflow: hidden;
  }

  /* --- Splash screen --- */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--bg);
    transition: opacity 0.35s ease;
  }
  #splash.splash-hidden { opacity: 0; pointer-events: none; }
  .splash-logo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--button);
    color: var(--button-text);
    font-size: 36px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .splash-name { font-size: 19px; font-weight: 600; }
  .splash-spacer { flex: 1; max-height: 80px; }
  .splash-credit {
    position: fixed;
    bottom: max(24px, env(safe-area-inset-bottom));
    padding: 8px 16px;
    border-radius: 20px;
    background: var(--secondary-bg);
    color: var(--hint);
    font-size: 12.5px;
    font-weight: 500;
  }

  /* --- Brand / hamburger header --- */
  .brand {
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .brand-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--button);
    color: var(--button-text);
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* --- Menu drawer --- */
  .menu-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0, 0, 0, 0);
    transition: background 0.25s ease;
  }
  .menu-overlay.visible { background: rgba(0, 0, 0, 0.4); }
  .menu-drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 78%;
    max-width: 300px;
    z-index: 41;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: -8px 0 24px rgba(0, 0, 0, 0.15);
  }
  .menu-drawer.open { transform: translateX(0); }
  .menu-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
    padding: 32px 20px 20px;
    border-bottom: 1px solid var(--section-separator);
  }
  .menu-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--button);
    color: var(--button-text);
    font-size: 26px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .menu-bot-name { font-size: 16.5px; font-weight: 600; }
  .menu-designer { font-size: 12.5px; color: var(--hint); }
  .menu-list { padding: 10px 0; flex: 1; }
  .menu-item {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 15px;
    text-align: left;
    cursor: pointer;
  }
  .menu-item:active { background: var(--secondary-bg); }
  .menu-item-icon { font-size: 18px; width: 20px; text-align: center; }
  .menu-footer { padding: 16px 20px; display: flex; justify-content: center; }
  .credit-box {
    padding: 8px 14px;
    border-radius: 20px;
    background: var(--secondary-bg);
    color: var(--hint);
    font-size: 12px;
    font-weight: 500;
    text-align: center;
  }

  .view {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .view { transition: none; }
  }
  #view-chat, #view-settings { transform: translateX(100%); }
  #app.chat-active #view-list { transform: translateX(-30%); }
  #app.chat-active #view-chat { transform: translateX(0); }
  #app.settings-active #view-list { transform: translateX(-30%); }
  #app.settings-active #view-settings { transform: translateX(0); }

  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 12px;
    background: var(--header-bg);
    border-bottom: 1px solid var(--section-separator);
    flex-shrink: 0;
  }
  .topbar h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .icon-btn {
    background: none;
    border: none;
    color: var(--link);
    font-size: 22px;
    line-height: 1;
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 8px;
  }
  .icon-btn:active { background: var(--section-separator); }

  /* --- Chat list --- */
  .chat-list { flex: 1; overflow-y: auto; }
  .chat-row {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--section-separator);
    cursor: pointer;
  }
  .chat-row:active { background: var(--secondary-bg); }
  .chat-row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .chat-row-title { font-size: 15.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-row-time { font-size: 12.5px; color: var(--hint); flex-shrink: 0; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--hint);
    padding: 24px;
    text-align: center;
  }
  .empty-state p { margin: 0; }
  .empty-state .headline { font-size: 15.5px; color: var(--text); font-weight: 500; }

  /* --- Chat view --- */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .bubble {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.35;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--button);
    color: var(--button-text);
    border-bottom-right-radius: 4px;
  }
  .bubble.assistant {
    align-self: flex-start;
    background: var(--secondary-bg);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .bubble.error {
    align-self: center;
    background: transparent;
    color: var(--hint);
    font-size: 13px;
    text-align: center;
    max-width: 100%;
  }

  .typing-dots { display: inline-flex; gap: 3px; align-items: center; padding: 4px 2px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--hint);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 10px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--section-separator);
    background: var(--bg);
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    resize: none;
    max-height: 120px;
    border: 1px solid var(--section-separator);
    border-radius: 18px;
    padding: 9px 14px;
    font-size: 15px;
    font-family: inherit;
    background: var(--secondary-bg);
    color: var(--text);
    outline: none;
  }
  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--button);
    color: var(--button-text);
    font-size: 15px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send-btn:disabled { opacity: 0.5; }

  .auth-error {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: var(--hint);
    font-size: 14px;
  }

  /* --- Settings view --- */
  .settings-body { flex: 1; overflow-y: auto; padding: 16px; }
  .settings-section {
    background: var(--secondary-bg);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .settings-label { font-size: 15px; font-weight: 500; }
  .settings-hint { font-size: 12.5px; color: var(--hint); margin-top: 3px; line-height: 1.4; }
  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

  .segmented {
    display: flex;
    background: var(--bg);
    border-radius: 8px;
    padding: 3px;
    margin-top: 10px;
  }
  .segmented-btn {
    flex: 1;
    border: none;
    background: none;
    padding: 7px 0;
    font-size: 13.5px;
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
  }
  .segmented-btn.active { background: var(--button); color: var(--button-text); }

  .switch { position: relative; display: inline-block; width: 44px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-slider {
    position: absolute;
    inset: 0;
    background: var(--section-separator);
    border-radius: 26px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .switch-slider::before {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    left: 3px;
    top: 3px;
    background: #ffffff;
    border-radius: 50%;
    transition: transform 0.2s ease;
  }
  .switch input:checked + .switch-slider { background: var(--button); }
  .switch input:checked + .switch-slider::before { transform: translateX(18px); }

  .memory-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 0;
    border-bottom: 1px solid var(--section-separator);
  }
  .memory-row:last-of-type { border-bottom: none; }
  .memory-row-text {
    flex: 1;
    font-size: 14px;
    line-height: 1.4;
    padding-top: 2px;
    word-wrap: break-word;
  }
  .memory-row-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .memory-icon-btn {
    background: none;
    border: none;
    color: var(--hint);
    font-size: 15px;
    padding: 4px 6px;
    cursor: pointer;
    border-radius: 6px;
  }
  .memory-icon-btn:active { background: var(--secondary-bg); }
  .memory-edit-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .memory-edit-area textarea {
    width: 100%;
    resize: vertical;
    min-height: 44px;
    border: 1px solid var(--section-separator);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
  }
  .memory-edit-actions { display: flex; gap: 8px; }
  .memory-edit-actions button {
    border: none;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .memory-save-btn { background: var(--button); color: var(--button-text); }
  .memory-cancel-btn { background: var(--secondary-bg); color: var(--text); }
  .memory-empty { color: var(--hint); font-size: 13.5px; padding: 6px 0; }
</style>
</head>
<body>
<div id="splash">
  <div class="splash-logo" id="splash-avatar"></div>
  <div class="splash-name" id="splash-name"></div>
  <div class="splash-spacer"></div>
  <div class="splash-credit">🤖 @assist_ai</div>
</div>
<div id="app">
  <div id="view-list" class="view">
    <header class="topbar">
      <div class="brand" id="open-menu-brand">
        <div class="brand-avatar" id="brand-avatar"></div>
      </div>
      <h1>Chats</h1>
      <button id="menu-btn" class="icon-btn" aria-label="Menu">☰</button>
    </header>
    <div id="chat-list" class="chat-list"></div>
    <div id="empty-state" class="empty-state" hidden>
      <p class="headline">No chats yet</p>
      <p>Tap + to start one.</p>
    </div>
    <!-- kept in the list view so it's easy to find; could move to a footer bar later -->
    <button id="new-chat-fab" class="icon-btn" style="position:absolute; right:16px; bottom:20px; background:var(--button); color:var(--button-text); width:48px; height:48px; border-radius:50%; font-size:24px;" aria-label="New chat">+</button>
  </div>

  <div id="view-chat" class="view">
    <header class="topbar">
      <button id="back-btn" class="icon-btn" aria-label="Back">‹</button>
      <h1 id="chat-title">Chat</h1>
    </header>
    <div id="messages" class="messages"></div>
    <form id="composer" class="composer">
      <textarea id="input" placeholder="Message" rows="1"></textarea>
      <button id="send-btn" class="send-btn" type="submit" aria-label="Send">➤</button>
    </form>
  </div>

  <div id="view-settings" class="view">
    <header class="topbar">
      <button id="settings-back-btn" class="icon-btn" aria-label="Back">‹</button>
      <h1>Settings</h1>
    </header>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-label">Theme</div>
        <div class="segmented" id="theme-segmented">
          <button type="button" class="segmented-btn" data-theme="system">System</button>
          <button type="button" class="segmented-btn" data-theme="light">Light</button>
          <button type="button" class="segmented-btn" data-theme="dark">Dark</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-row">
          <div>
            <div class="settings-label">Memory</div>
            <div class="settings-hint">When on, the bot uses your saved memories below in every chat. Ask it to "remember" or "save" something and it'll add it here on its own.</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="memory-toggle" />
            <span class="switch-slider"></span>
          </label>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-row" style="margin-bottom: 8px;">
          <div class="settings-label">Saved memories</div>
          <div class="settings-hint" id="memory-count" style="margin-top:0;"></div>
        </div>
        <div id="memory-list"></div>
        <button type="button" class="menu-item" id="add-memory-btn" style="padding: 10px 0 2px;">+ Add memory</button>
      </div>
    </div>
  </div>
</div>

<div id="menu-overlay" class="menu-overlay" hidden></div>
<aside id="menu-drawer" class="menu-drawer">
  <div class="menu-header">
    <div class="menu-avatar" id="menu-avatar"></div>
    <div class="menu-bot-name" id="menu-bot-name"></div>
    <div class="menu-designer">Powered by @assist_ai</div>
  </div>
  <nav class="menu-list">
    <button class="menu-item" id="open-settings-btn">
      <span class="menu-item-icon">⚙️</span> Settings
    </button>
  </nav>
  <div class="menu-footer">
    <div class="credit-box">@assist_ai · © 2026</div>
  </div>
</aside>

<script>
  // Edit this to your bot's real display name — it drives the splash
  // screen, the menu header, and the page title. Swap the .brand-avatar /
  // .menu-avatar / .splash-logo divs for a real <img> once you have an
  // actual logo file; for now they show the first letter as a placeholder,
  // Telegram-contact-photo style.
  const BOT_NAME = "assist_ai";

  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();
  tg?.disableVerticalSwipes?.();

  const initData = tg?.initData || "";

  const appEl = document.getElementById("app");
  const chatListEl = document.getElementById("chat-list");
  const emptyStateEl = document.getElementById("empty-state");
  const messagesEl = document.getElementById("messages");
  const chatTitleEl = document.getElementById("chat-title");
  const composerEl = document.getElementById("composer");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send-btn");
  const newChatBtn = document.getElementById("new-chat-fab");
  const backBtn = document.getElementById("back-btn");
  const menuBtn = document.getElementById("menu-btn");
  const brandBtn = document.getElementById("open-menu-brand");
  const menuOverlay = document.getElementById("menu-overlay");
  const menuDrawer = document.getElementById("menu-drawer");
  const settingsBackBtn = document.getElementById("settings-back-btn");
  const openSettingsBtn = document.getElementById("open-settings-btn");
  const themeSegmented = document.getElementById("theme-segmented");
  const memoryToggle = document.getElementById("memory-toggle");
  const memoryListEl = document.getElementById("memory-list");
  const memoryCountEl = document.getElementById("memory-count");
  const addMemoryBtn = document.getElementById("add-memory-btn");

  document.title = BOT_NAME;
  const initial = BOT_NAME.trim().charAt(0).toUpperCase() || "?";
  for (const id of ["splash-avatar", "brand-avatar", "menu-avatar"]) {
    document.getElementById(id).textContent = initial;
  }
  document.getElementById("splash-name").textContent = BOT_NAME;
  document.getElementById("menu-bot-name").textContent = BOT_NAME;

  let activeChatId = null;

  async function apiFetch(path, options = {}) {
    const resp = await fetch(path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        "X-Telegram-Init-Data": initData,
        ...(options.headers || {}),
      },
    });
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.error || `Request failed (${resp.status})`);
    }
    return resp.json();
  }

  function relativeTime(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.round(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.round(hours / 24);
    if (days < 7) return `${days}d ago`;
    return new Date(iso).toLocaleDateString();
  }

  function showListView() {
    appEl.classList.remove("chat-active", "settings-active");
    activeChatId = null;
    tg?.BackButton?.hide();
  }

  function showChatView() {
    appEl.classList.add("chat-active");
    tg?.BackButton?.show();
  }

  function showSettingsView() {
    appEl.classList.add("settings-active");
    tg?.BackButton?.show();
  }

  tg?.BackButton?.onClick(() => showListView());

  // --- Theme (System / Light / Dark) ---
  const THEME_KEY = "miniapp-theme";

  function applyTheme(theme) {
    document.documentElement.classList.remove("theme-light", "theme-dark");
    if (theme === "light") document.documentElement.classList.add("theme-light");
    if (theme === "dark") document.documentElement.classList.add("theme-dark");
    for (const btn of themeSegmented.querySelectorAll(".segmented-btn")) {
      btn.classList.toggle("active", btn.dataset.theme === theme);
    }
  }

  const savedTheme = localStorage.getItem(THEME_KEY) || "system";
  applyTheme(savedTheme);

  themeSegmented.addEventListener("click", (e) => {
    const btn = e.target.closest(".segmented-btn");
    if (!btn) return;
    localStorage.setItem(THEME_KEY, btn.dataset.theme);
    applyTheme(btn.dataset.theme);
  });

  // --- Menu drawer ---
  function openMenu() {
    menuOverlay.hidden = false;
    requestAnimationFrame(() => {
      menuOverlay.classList.add("visible");
      menuDrawer.classList.add("open");
    });
  }
  function closeMenu() {
    menuOverlay.classList.remove("visible");
    menuDrawer.classList.remove("open");
    setTimeout(() => { menuOverlay.hidden = true; }, 250);
  }
  menuBtn.addEventListener("click", openMenu);
  brandBtn.addEventListener("click", openMenu);
  menuOverlay.addEventListener("click", closeMenu);

  openSettingsBtn.addEventListener("click", () => {
    closeMenu();
    showSettingsView();
    loadSettings();
    loadMemories();
  });
  settingsBackBtn.addEventListener("click", showListView);

  // --- Memory toggle (server-side — it affects how new chats are
  // answered, so it has to live on the backend, not just this device) ---
  async function loadSettings() {
    try {
      const settings = await apiFetch("/api/miniapp/settings");
      memoryToggle.checked = !!settings.memoryEnabled;
    } catch {
      // Leave it as-is rather than blocking the settings screen over this.
    }
  }

  memoryToggle.addEventListener("change", async () => {
    const desired = memoryToggle.checked;
    memoryToggle.disabled = true;
    try {
      await apiFetch("/api/miniapp/settings", {
        method: "POST",
        body: JSON.stringify({ memoryEnabled: desired }),
      });
    } catch {
      memoryToggle.checked = !desired; // revert on failure
    } finally {
      memoryToggle.disabled = false;
    }
  });

  // --- Memory list (view / add / edit / delete) ---
  let memoryLimit = 5;

  async function loadMemories() {
    try {
      const data = await apiFetch("/api/miniapp/memories");
      memoryLimit = data.limit;
      renderMemoryList(data.memories);
    } catch {
      memoryListEl.innerHTML = `<div class="memory-empty">Couldn't load memories right now.</div>`;
    }
  }

  function renderMemoryList(list) {
    memoryCountEl.textContent = `${list.length}/${memoryLimit}`;
    addMemoryBtn.hidden = list.length >= memoryLimit;
    memoryListEl.innerHTML = "";
    if (list.length === 0) {
      memoryListEl.innerHTML = `<div class="memory-empty">Nothing saved yet.</div>`;
      return;
    }
    for (const memory of list) memoryListEl.appendChild(renderMemoryRow(memory));
  }

  function renderMemoryRow(memory) {
    const row = document.createElement("div");
    row.className = "memory-row";
    row.innerHTML = `
      <div class="memory-row-text"></div>
      <div class="memory-row-actions">
        <button type="button" class="memory-icon-btn" aria-label="Edit">✎</button>
        <button type="button" class="memory-icon-btn" aria-label="Delete">✕</button>
      </div>`;
    row.querySelector(".memory-row-text").textContent = memory.content;

    const [editBtn, deleteBtn] = row.querySelectorAll(".memory-icon-btn");

    editBtn.addEventListener("click", () => {
      row.innerHTML = `
        <div class="memory-edit-area">
          <textarea maxlength="300"></textarea>
          <div class="memory-edit-actions">
            <button type="button" class="memory-save-btn">Save</button>
            <button type="button" class="memory-cancel-btn">Cancel</button>
          </div>
        </div>`;
      const textarea = row.querySelector("textarea");
      textarea.value = memory.content;
      textarea.focus();
      row.querySelector(".memory-cancel-btn").addEventListener("click", () => loadMemories());
      row.querySelector(".memory-save-btn").addEventListener("click", async () => {
        const value = textarea.value.trim();
        if (!value) return;
        try {
          await apiFetch("/api/miniapp/memories", {
            method: "PATCH",
            body: JSON.stringify({ id: memory.id, content: value }),
          });
          loadMemories();
        } catch (err) {
          tg?.showAlert?.(`Couldn't save: ${err.message}`) ?? alert(`Couldn't save: ${err.message}`);
        }
      });
    });

    deleteBtn.addEventListener("click", () => {
      const doDelete = async () => {
        try {
          await apiFetch("/api/miniapp/memories", {
            method: "DELETE",
            body: JSON.stringify({ id: memory.id }),
          });
          loadMemories();
        } catch (err) {
          tg?.showAlert?.(`Couldn't delete: ${err.message}`) ?? alert(`Couldn't delete: ${err.message}`);
        }
      };
      if (tg?.showConfirm) {
        tg.showConfirm("Delete this memory?", (ok) => ok && doDelete());
      } else if (confirm("Delete this memory?")) {
        doDelete();
      }
    });

    return row;
  }

  addMemoryBtn.addEventListener("click", () => {
    const row = document.createElement("div");
    row.className = "memory-row";
    row.innerHTML = `
      <div class="memory-edit-area">
        <textarea maxlength="300" placeholder="e.g. I'm working on a Next.js project called EcoFurnish"></textarea>
        <div class="memory-edit-actions">
          <button type="button" class="memory-save-btn">Add</button>
          <button type="button" class="memory-cancel-btn">Cancel</button>
        </div>
      </div>`;
    memoryListEl.prepend(row);
    const textarea = row.querySelector("textarea");
    textarea.focus();
    row.querySelector(".memory-cancel-btn").addEventListener("click", () => row.remove());
    row.querySelector(".memory-save-btn").addEventListener("click", async () => {
      const value = textarea.value.trim();
      if (!value) return;
      try {
        await apiFetch("/api/miniapp/memories", {
          method: "POST",
          body: JSON.stringify({ content: value }),
        });
        loadMemories();
      } catch (err) {
        tg?.showAlert?.(`Couldn't add: ${err.message}`) ?? alert(`Couldn't add: ${err.message}`);
      }
    });
  });

  function renderChatList(chats) {
    chatListEl.innerHTML = "";
    emptyStateEl.hidden = chats.length > 0;
    for (const chat of chats) {
      const row = document.createElement("div");
      row.className = "chat-row";
      row.innerHTML = `
        <div class="chat-row-top">
          <span class="chat-row-title"></span>
          <span class="chat-row-time"></span>
        </div>`;
      row.querySelector(".chat-row-title").textContent = chat.title;
      row.querySelector(".chat-row-time").textContent = relativeTime(chat.updatedAt);
      row.addEventListener("click", () => openChat(chat.id, chat.title));
      chatListEl.appendChild(row);
    }
  }

  async function loadChats() {
    try {
      const chats = await apiFetch("/api/miniapp/chats");
      renderChatList(chats);
    } catch (err) {
      showAuthError(err.message);
    }
  }

  function showAuthError(message) {
    document.getElementById("view-list").innerHTML =
      `<div class="auth-error">Couldn't load your chats — open this from the bot inside Telegram.<br><br>(${message})</div>`;
  }

  function renderBubble(role, content) {
    const el = document.createElement("div");
    el.className = `bubble ${role}`;
    el.textContent = content;
    messagesEl.appendChild(el);
    return el;
  }

  function renderTypingBubble() {
    const el = document.createElement("div");
    el.className = "bubble assistant";
    el.innerHTML = `<span class="typing-dots"><span></span><span></span><span></span></span>`;
    messagesEl.appendChild(el);
    return el;
  }

  function scrollMessagesToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function openChat(chatId, title) {
    activeChatId = chatId;
    chatTitleEl.textContent = title;
    messagesEl.innerHTML = "";
    showChatView();
    try {
      const history = await apiFetch(`/api/miniapp/messages?chatId=${chatId}`);
      for (const m of history) renderBubble(m.role, m.content);
      scrollMessagesToBottom();
    } catch (err) {
      renderBubble("error", `Couldn't load this chat: ${err.message}`);
    }
    inputEl.focus();
  }

  newChatBtn.addEventListener("click", async () => {
    newChatBtn.disabled = true;
    try {
      const chat = await apiFetch("/api/miniapp/chats", { method: "POST" });
      await openChat(chat.id, chat.title);
    } catch (err) {
      showAuthError(err.message);
    } finally {
      newChatBtn.disabled = false;
    }
  });

  backBtn.addEventListener("click", () => {
    showListView();
    loadChats();
  });

  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = `${inputEl.scrollHeight}px`;
  });

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      composerEl.requestSubmit();
    }
  });

  composerEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text || !activeChatId) return;

    tg?.HapticFeedback?.impactOccurred?.("light");
    inputEl.value = "";
    inputEl.style.height = "auto";
    sendBtn.disabled = true;

    renderBubble("user", text);
    const typingEl = renderTypingBubble();
    scrollMessagesToBottom();

    try {
      const reply = await apiFetch("/api/miniapp/messages", {
        method: "POST",
        body: JSON.stringify({ chatId: activeChatId, content: text }),
      });
      typingEl.remove();
      renderBubble("assistant", reply.content);
    } catch (err) {
      typingEl.remove();
      renderBubble("error", `Couldn't send that: ${err.message}`);
      inputEl.value = text; // give the message back instead of losing it
    } finally {
      sendBtn.disabled = false;
      scrollMessagesToBottom();
    }
  });

  const MIN_SPLASH_MS = 700;
  const MAX_SPLASH_MS = 3000;

  function hideSplash() {
    const el = document.getElementById("splash");
    el.classList.add("splash-hidden");
    setTimeout(() => el.remove(), 400);
  }

  if (!initData) {
    showAuthError("no Telegram session found");
    setTimeout(hideSplash, MIN_SPLASH_MS);
  } else {
    const started = Date.now();
    Promise.race([loadChats(), new Promise((r) => setTimeout(r, MAX_SPLASH_MS))]).finally(() => {
      const elapsed = Date.now() - started;
      setTimeout(hideSplash, Math.max(0, MIN_SPLASH_MS - elapsed));
    });
  }

</script>
</body>
</html>
